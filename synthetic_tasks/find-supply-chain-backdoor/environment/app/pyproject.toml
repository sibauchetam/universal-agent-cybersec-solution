[project]
name = "reporting-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pytest>=8.0.0",
]

# The app runs from source (uvicorn main:app). deploy/, vendor/ and scripts/
# are audit targets and are deliberately NOT installed or executed.
[tool.setuptools]
packages = []
